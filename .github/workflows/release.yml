name: Release

# Push a tag that matches package.json's version, e.g. `git tag v0.2.0 && git push --tags`.
# Publishes to npm with trusted publishing (OIDC): no npm token is stored here.
# The package must exist on npm with this workflow set as its trusted publisher.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub release
  id-token: write # npm trusted publishing and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

      - name: Tag matches package.json
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      # re-running a release, or tagging a version published by hand, must not fail
      - name: Already on npm?
        id: npm
        run: |
          spec="$(node -p 'const p = require("./package.json"); `${p.name}@${p.version}`')"
          if npm view "$spec" version > /dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$spec is already on npm; skipping publish"
          fi

      # trusted publishing needs npm 11.5.1 or later
      - if: steps.npm.outputs.published != 'true'
        run: npm install -g npm@latest
      - if: steps.npm.outputs.published != 'true'
        run: npm publish --access public

      - name: GitHub release
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "::notice::release $GITHUB_REF_NAME already exists"
          else
            gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
          fi
        env:
          GH_TOKEN: ${{ github.token }}
